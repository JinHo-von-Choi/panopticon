name: gates

# PostgreSQL 마이그레이션과 출시 검사를 실행한다.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netwatcher_test
          POSTGRES_USER: netwatcher
          POSTGRES_PASSWORD: netwatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netwatcher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NETWATCHER_DB_HOST: localhost
      NETWATCHER_DB_PORT: "5432"
      NETWATCHER_DB_NAME: netwatcher_test
      NETWATCHER_DB_USER: netwatcher
      NETWATCHER_DB_PASSWORD: netwatcher
      NETWATCHER_TEST_DB_HOST: localhost
      NETWATCHER_TEST_DB_PORT: "5432"
      NETWATCHER_TEST_DB_NAME: netwatcher_test
      NETWATCHER_TEST_DB_USER: netwatcher
      NETWATCHER_TEST_DB_PASSWORD: netwatcher
      # 개발자의 .env 대신 CI 설정을 사용한다.
      NETWATCHER_SKIP_DOTENV: "1"
      PANOPTICON_NATIVE_SENSOR_IMAGE: panopticon-native-gates:test
      PANOPTICON_NATIVE_CONSOLE_IMAGE: panopticon-console-gates:test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Prepare browser and isolated runtime tests
        run: |
          npm ci --prefix tests/browser --ignore-scripts
          command -v google-chrome
          echo "PANOPTICON_PLAYWRIGHT_CORE=$GITHUB_WORKSPACE/tests/browser/node_modules/playwright-core" >> "$GITHUB_ENV"
          echo "PANOPTICON_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          docker build --target native -t "$PANOPTICON_NATIVE_SENSOR_IMAGE" .
          docker build --target native-console -t "$PANOPTICON_NATIVE_CONSOLE_IMAGE" .

      - name: Apply migrations and ensure event partitions (G0-4/G0-16 pre-step)
        run: python -m netwatcher.storage.migrate

      - name: Check EVE browser startup after full test collection
        run: python -m pytest tests/ -k test_backlog_and_unknown_position_reach_actual_console -q -p no:cacheprovider

      - name: Assert browser tests actually ran
        # 브라우저 시험은 환경이 없으면 건너뛴다. 건너뛴 채 초록이면
        # 브라우저 시험이 없는 것과 같다.
        run: |
          python -m pytest tests/ -k browser -q -p no:cacheprovider --junitxml=/tmp/browser.xml
          python scripts/assert_browser_ran.py /tmp/browser.xml

      - name: Type check latch
        # 타입 오류는 늘릴 수만 있다. 기준선은 Python 버전별로 따로 둔다 —
        # 3.12 와 3.13 은 표준 라이브러리 스텁이 달라 오류 수가 다르다.
        # 하나를 고칠 때마다 scripts/mypy_baseline.json 의 해당 값을 내린다.
        run: python scripts/mypy_latch.py

      - name: Run release gates (G0)
        env:
          PANOPTICON_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python scripts/gates.py

  db-deploy-check:
    # 새 DB에서 전체 마이그레이션과 마지막 단계의 되돌리기를 확인한다.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netwatcher_fresh
          POSTGRES_USER: netwatcher
          POSTGRES_PASSWORD: netwatcher
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netwatcher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NETWATCHER_DB_HOST: localhost
      NETWATCHER_DB_PORT: "5432"
      NETWATCHER_DB_NAME: netwatcher_fresh
      NETWATCHER_DB_USER: netwatcher
      NETWATCHER_DB_PASSWORD: netwatcher

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      - name: Upgrade to head on a clean database
        run: python -m alembic upgrade head

      - name: Downgrade one step and upgrade again
        # 전환 마이그레이션이 왕복 가능한지 확인한다 (데이터 보존 경로).
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Migration static guards
        run: python -m pytest tests/test_utils/test_migrations.py -q
