services:
  netwatcher:
    build:
      context: .
      target: eve
    stop_grace_period: 15s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:38585:38585"
    group_add:
      - "${PANOPTICON_EVE_GID:-10001}"
    volumes:
      - ${PANOPTICON_CONFIG_DIR:-./config}:/app/config:ro
      - nw-data:/app/data
      - type: bind
        source: ${PANOPTICON_EVE_DIR:-/var/log/suricata}
        target: /var/log/suricata
        read_only: true
        bind:
          create_host_path: false
      # TLS 인증서 (web.tls.enabled: true 시 마운트)
      # - /etc/ssl/certs/netwatcher.pem:/app/certs/cert.pem:ro
      # - /etc/ssl/private/netwatcher.key:/app/certs/key.pem:ro
    env_file:
      - ${PANOPTICON_ENV_FILE:-.env}
    environment:
      NETWATCHER_WEB_HOST: "0.0.0.0"
      NETWATCHER_DB_HOST: "${NETWATCHER_DB_HOST:-db}"

    depends_on:
      db:
        condition: service_healthy
        required: false

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles:
      - db
    environment:
      POSTGRES_DB: ${NETWATCHER_DB_NAME:-netwatcher}
      POSTGRES_USER: ${NETWATCHER_DB_USER:-netwatcher}
      POSTGRES_PASSWORD: ${NETWATCHER_DB_PASSWORD:?DB password required}
    volumes:
      - nw-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PANOPTICON_DB_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NETWATCHER_DB_USER:-netwatcher}"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-migrate:
    build:
      context: .
      target: eve
    profiles:
      - migrate
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${PANOPTICON_CONFIG_DIR:-./config}:/app/config:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
    env_file:
      - ${PANOPTICON_ENV_FILE:-.env}
    environment:
      NETWATCHER_DB_HOST: "${NETWATCHER_DB_HOST:-db}"
    entrypoint: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
        required: false

volumes:
  nw-data:
  nw-pgdata:
