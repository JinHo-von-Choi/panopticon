# 자격증명은 환경변수 또는 .env 파일에서 로드됨.
# 환경변수 목록: NETWATCHER_DB_HOST, NETWATCHER_DB_PORT, NETWATCHER_DB_NAME,
# NETWATCHER_DB_USER, NETWATCHER_DB_PASSWORD, NETWATCHER_SLACK_WEBHOOK_URL,
# NETWATCHER_SLACK_DASHBOARD_URL, NETWATCHER_JWT_SECRET (.env.example 참조)
netwatcher:
  language:
    default: "ko"
    available: ["ko", "en"]
  interface:       # null = auto-detect
  bpf_filter: ""   # additional BPF filter
  promiscuous: true
  workers: 1        # 패킷 분석 워커 프로세스 수 (0=자동(CPU-1), 1=단일프로세스, 2+=멀티프로세스)

  netflow:
    enabled: false           # true로 설정 시 NetFlow/IPFIX 수신 활성화
    host: "0.0.0.0"          # 수신 바인딩 주소
    port: 2055               # 표준 NetFlow UDP 포트 (2055, 또는 9995/9996)
    engines:
      flow_port_scan:
        enabled: true
        window_seconds: 60
        threshold: 15        # 고유 목적지 포트 수 임계값
        cooldown_seconds: 300
      flow_data_exfil:
        enabled: true
        byte_threshold: 104857600  # 100MB
        window_seconds: 3600

  postgresql:
    enabled: true
    host: "localhost"
    port: 35432
    database: "bee_db"
    username: "bee"
    password: ""
    pool_size: 20
    max_overflow: 40
    ssl_mode: "disable"  # disable, allow, prefer, require, verify-ca, verify-full
    ssl_ca_file: ""       # verify-ca/full의 CA PEM. 빈 값이면 시스템 신뢰 저장소

  logging:
    level: "INFO"
    directory: "data/logs"
    max_bytes: 10485760  # 10MB
    backup_count: 5
    format: "text"       # "text" or "json"

  web:
    # 기본은 루프백 바인딩이다. 인증 없이 0.0.0.0 에 열면 LAN 전체가
    # 비밀번호 없는 대시보드에 접근한다 — 지원 계약 SUP-020 이 이 구성을
    # 거부한다. LAN 으로 노출하려면 아래 두 가지를 **둘 다** 명시하라.
    #   1) web.host: "0.0.0.0"
    #   2) auth.enabled: true + NETWATCHER_LOGIN_PASSWORD
    # 둘 중 하나만 하면 기동 전에 거부된다.
    host: "127.0.0.1"
    port: 38585
    enable_docs: false   # /docs, /openapi.json 활성화 여부
    tls:
      enabled: false           # true로 설정 시 HTTPS 활성화
      certfile: ""             # PEM 인증서 경로 (예: /etc/ssl/certs/netwatcher.pem)
      keyfile: ""              # PEM 개인키 경로 (예: /etc/ssl/private/netwatcher.key)
      # 리버스 프록시(Nginx 등) 뒤에서 운영할 경우 false로 유지하고
      # 프록시에서 TLS 종료 처리
    trusted_proxies:           # X-Forwarded-For를 신뢰할 리버스 프록시 주소
    - "127.0.0.1"
    - "::1"
    cors:
      allowed_origins:
      - "http://localhost:38585"

  auth:
    enabled: false           # 비밀번호 설정 후 true로 변경
    username: "admin"
    password: ""          # 반드시 환경변수(NETWATCHER_LOGIN_PASSWORD)로 설정
    token_expire_hours: 24
    login_attempts_per_minute: 10
    multi_user: false        # false = 기존 단일 사용자 모드 유지
    default_admin_password: ""
    api_rate_limit:
      enabled: true
      requests_per_minute: 60
      burst: 10

  retention:
    events_days: 90            # 이벤트 보존 일수
    traffic_stats_days: 365    # 트래픽 통계 보존 일수
    incidents_days: 180        # 인시던트 보존 일수
    cleanup_interval_hours: 6  # 정리 주기

  storage:
    max_pending_age_seconds: 300

  evidence:
    directory: "data/pcaps"
    buffer_packets: 1000
    buffer_bytes: 8388608
    queue_jobs: 32
    queue_bytes: 8388608
    cooldown_seconds: 60
    max_storage_mb: 500
    max_files: 10000
    max_deletes_per_second: 4

  alerts:
    aggregation:
      enabled: true
      window_seconds: 60
      max_keys: 10000
    event_budget:
      normal_per_minute: 120
      critical_reserve_per_minute: 30
    # 종료 시 큐에 남은 알림을 배 emptying하는 최대 초 (PR 06).
    # 이 시간 안에 처리되지 못한 알림은 경고와 함께 포기한다.
    drain_timeout_seconds: 5
    rate_limit:
      window_seconds: 300  # 5 minutes
      max_per_key: 5
    channels:
      telegram:
        enabled: false
        bot_token: ""
        chat_id: ""
        min_severity: "WARNING"
      slack:
        enabled: false
        webhook_url: ""
        min_severity: "CRITICAL"
        dashboard_url: ""                              # 환경변수 또는 직접 설정
      discord:
        enabled: true
        webhook_url: ""           # 반드시 환경변수(NETWATCHER_DISCORD_WEBHOOK_URL)로 설정
        min_severity: "WARNING"

  # Whitelist: suppress alerts for known-safe entities
  whitelist:
    ips:
    - 14.63.60.117
    - 211.58.70.14
    ip_ranges: []        # CIDR notation, e.g. "192.168.1.0/24"
    macs:
    - 50:eb:f6:7d:0c:8c
    - 90:09:d0:00:c5:c3
    - b0:38:6c:4e:29:0b
    - e8:9c:25:dc:30:d2
    domains:
    - captive.apple.com
    - connectivity-check.ubuntu.com
    - connectivitycheck.gstatic.com
    - detectportal.firefox.com
    - github.com
    - gitlab.com
    - google.com
    - nerdvana.kr
    - nmcheck.gnome.org
    - raw.githubusercontent.com
    - www.msftconnecttest.com
    domain_suffixes:
    - .internal
    - .local
  engines:
    arp_spoof:
      enabled: true
      gratuitous_window_seconds: 60    # sliding window for gratuitous ARP flood
      gratuitous_threshold: 6                  # gratuitous ARP count to trigger alert
      cooldown_seconds: 300            # re-alert cooldown

      max_tracked_hosts: 10000
    dns_anomaly:
      enabled: true
      entropy_threshold: 3.8           # 3.5->3.8, reduce DGA false positives
    port_scan:
      enabled: true
      window_seconds: 60
      threshold: 50
    http_suspicious:
      enabled: true
    traffic_anomaly:
      enabled: true
      max_tracked_hosts: 50000        # max hosts tracked

    tls_fingerprint:
      enabled: true
      check_ja3: true
      check_ja3s: true
      check_ja4: true
      check_sni: true
      check_cert: true

    dns_response:
      enabled: true
      nxdomain_threshold: 10
      fastflux_threshold: 11
      window_seconds: 300
    threat_intel:
      enabled: true
    icmp_anomaly:
      enabled: true
      flood_threshold: 100            # ICMP packets per second
    dhcp_spoof:
      enabled: true
      known_servers: []               # 정상 DHCP 서버 IP 목록 (빈 목록 = 자동 학습)
      starvation_threshold: 50        # DISCOVER count to detect starvation
      starvation_window_seconds: 60

    lateral_movement:
      enabled: true
      window_seconds: 300             # 5 minute window
    data_exfil:
      enabled: true
      window_seconds: 3600            # 1 hour
      outbound_threshold_mb: 51
    protocol_anomaly:
      enabled: true
    mac_spoof:
      enabled: true
      max_ips_per_mac: 4              # IPs per MAC before alert
      ip_window_seconds: 600          # window for tracking IPs per MAC
      max_tracked_macs: 10000         # max tracked MACs

    protocol_inspect:
      enabled: true
    behavior_profile:
      enabled: true
      learning_period_seconds: 3600
      deviation_threshold: 2.5
    signature:
      enabled: true
      rules_dir: "config/rules"
    ransomware_lateral:
      enabled: true
      honeypot_ips: []                  # honeypot IPs: any contact triggers CRITICAL
    segment_violation:
      enabled: true                     # SPAN 포트 필요 — 환경에 맞게 활성화
      cooldown_seconds: 300
      allowed_flows: []                 # 예: [{src_net: "10.0.0.0/24", dst_net: "10.0.1.0/24", ports: [80,443], proto: "tcp"}]

    dark_ip:
      enabled: true                     # SPAN 포트 필요 — monitored_networks 설정 후 활성화
      monitored_networks: []            # 예: ["10.0.0.0/8"]
      known_hosts: []                   # 정적으로 알려진 내부 호스트 IP 목록
      learn_seconds: 300               # 번인 기간 (초)
      cooldown_seconds: 3600
      auto_learn: true

    c2_beaconing:
      enabled: true
      cv_threshold: 0.3                # 분산 계수 임계값 (낮을수록 엄격)
      min_connections: 8               # 비콘 판정에 필요한 최소 IAT 샘플 수
      min_interval: 5.0                # 최소 비콘 주기 (초)
      max_interval: 3600.0             # 최대 비콘 주기 (초)
      cooldown_seconds: 3600

    file_extraction:
      enabled: true
      enable_http_carving: true
      enable_smtp_carving: true
      max_file_size_mb: 10
      vt_api_key: ''
      yara_rules_dir: config/yara
      output_dir: data/extracted
  # 지원 프로필 계약 (PR 01). 기동 시 위반이 있으면 어떤 컴포넌트도
  # 시작되지 않고 종료한다. limited 는 첫 제한 릴리스의 프로필이다.
  support:
    profile: limited               # limited | full

  response:
    enabled: false
    backend: "iptables"            # enforcement 는 iptables 만 검증 완료
    chain_name: "NETWATCHER_BLOCK" # INPUT 등 관측 범위 밖 체인은 거부
    default_duration: 3600         # 0(영구차단) 은 미지원
    max_blocks: 1000
    whitelist: []
    auto_block_engines:
    - "threat_intel"
    - "port_scan"
    - "arp_spoof"

  ai_analyzer:
    enabled: false                 # AI 오탐 분석 활성화 시 true (CLI 의존성 있음)
    apply_mode: propose            # 반드시 propose — AI는 제안만 한다 (PR 03)
    provider: "gemini"             # AI 프로바이더: copilot | claude | codex | gemini | agent
    interval_minutes: 15           # 분석 실행 주기
    lookback_minutes: 30           # 분석 대상 시간 범위 (최근 N분)
    max_events: 50                 # AI에 전달할 최대 이벤트 수
    consecutive_fp_threshold: 2    # 연속 오탐 판정 횟수 → 상향 *제안*
    max_threshold_increase_pct: 20 # 상향 제안 폭 상한 (%)
    consecutive_mt_threshold: 2    # 연속 미탐 판정 횟수 → 하향 *제안*
    max_threshold_decrease_pct: 10 # 하향 제안 폭 상한 (%)
    copilot_timeout_seconds: 180   # AI CLI 응답 타임아웃

  daily_report:
    enabled: true
    report_hour: 12  # KST noon

  asset_monitor:
    enabled: true
    check_interval_seconds: 60      # 기기 변경 감지 주기 (초)
    offline_threshold_minutes: 60   # 미관찰 후 오프라인 간주 시간 (분)

  analysis:
    enabled: false
    extract_files: true
    output_dir: "data/extracted"
    max_file_size: 10485760    # 10MB
    yara_rules_dir: "config/yara"

  redis:
    enabled: false
    host: "localhost"
    port: 6379
    db: 0
    password: ""
    key_prefix: "nw:"
    checkpoint_interval: 60   # 엔진 상태 체크포인트 주기 (초)

  ha:
    enabled: false              # true 시 Redis 기반 HA 클러스터 모드 활성화
    ttl_seconds: 30             # 리더 락 TTL / 하트비트 TTL
    lock_key: "ha:leader"       # 리더 선출 Redis 키

  integrations:
    syslog:
      enabled: false
      host: "localhost"
      port: 514
      protocol: "udp"         # udp, tcp, tls
      format: "cef"           # cef, rfc5424
      min_severity: "WARNING"
      tls_ca_cert: ""
    elasticsearch:
      enabled: false
      hosts: ["http://localhost:9200"]
      index_prefix: "netwatcher-events"
      api_key: ""
      username: ""
      password: ""
      min_severity: "INFO"
    stix_taxii:
      enabled: false
      taxii_url: ""
      collection_id: ""
      api_key: ""
      min_severity: "WARNING"

  observability:
    structlog: true
    log_format: "json"            # json | console
    tracing:
      enabled: false
      exporter: "otlp"
      endpoint: "http://localhost:4317"
      service_name: "netwatcher"
      sample_rate: 0.01
    health_check:
      detailed: true
    # 관측 범위 (계획서 3장): "경보 없음" 을 "문제 없음" 으로 읽히지 않게 한다.
    # heartbeat 가 이 주기만큼 오지 않으면 센서는 stale 로 판정된다.
    heartbeat_seconds: 10.0
    missed_beats_to_stale: 3

  threatfeeds:
    config_path: "config/threatfeeds.yaml"
